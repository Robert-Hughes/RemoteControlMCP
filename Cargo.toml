[package]
name = "remote-control-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
eframe = { version = "0.35", default-features = false, features = ["default_fonts"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
rmcp = { version = "3.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt", "io-util", "net", "time"] }
serde = { version = "1.0", features = ["derive"] }
schemars = { version = "1.0" }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["wgpu"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "x11", "wayland"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }